<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lifeguard360 — Your Safety Companion in Emergencies</title>
    <meta
      name="description"
      content="Lifeguard360: first aid guidance, emergency assistance, and nearby healthcare facilities."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * GitHub Pages SPA fallback (paired with public/404.html): when the app
       * was entered via /?/<route>, restore the real path before React Router
       * mounts so BrowserRouter (with the deployment basename) sees it.
       */
      (function () {
        var s = window.location.search;
        if (s.indexOf("?/") === 0) {
          var base = window.location.pathname.replace(/[^/]*$/, "");
          window.history.replaceState(null, "", base + s.slice(2));
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
